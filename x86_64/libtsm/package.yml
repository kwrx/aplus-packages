
package: libtsm
version: 4.8.0
sources:
  - https://github.com/kmscon/libtsm/archive/refs/tags/v$VERSION.tar.gz

build:

  patches:
    - patches/libtsm-$VERSION.patch

  env:
    - DESTDIR: $SYSROOT
    - PKG_CONFIG: /usr/bin/pkg-config
    - PKG_CONFIG_LIBDIR: $SYSROOT/usr/lib/pkgconfig

  configure:
    - -Dprefix=/usr
    - -Dlibdir=lib
    - -Dbuildtype=release
    - -Ddefault_library=static
    - -Dtests=false
    - --cross-file=$PKGDIR/meson/meson-cross-$HOST.txt

  make:
    - -j$(nproc)

  install:
    - -j$(nproc)
