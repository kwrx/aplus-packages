
package: pixman
version: 0.46.4
sources: 
  - https://www.cairographics.org/releases/pixman-$VERSION.tar.xz

build:

  env:
    - DESTDIR: $SYSROOT
    - CFLAGS: -O2 -march=x86-64 -mtune=generic
    - PKG_CONFIG: /usr/bin/pkg-config
    - PKG_CONFIG_LIBDIR: $SYSROOT/usr/lib/pkgconfig

  configure:
    - -Dprefix=/usr
    - -Dlibdir=lib
    - -Dbuildtype=release
    - -Ddefault_library=static
    - -Dstrip=true
    - -Dmmx=enabled
    - -Dsse2=enabled
    - -Dssse3=enabled
    - -Dgnu-inline-asm=enabled
    - -Dtls=enabled
    - -Dloongson-mmi=disabled
    - -Dvmx=disabled
    - -Darm-simd=disabled
    - -Dneon=disabled
    - -Da64-neon=disabled
    - -Dmips-dspr2=disabled
    - -Drvv=disabled
    - -Dopenmp=disabled
    - -Dtimers=false
    - -Dgnuplot=false
    - -Dgtk=disabled
    - -Dlibpng=disabled
    - -Dtests=disabled
    - -Ddemos=disabled
    - --cross-file=$PKGDIR/meson/meson-cross-$HOST.txt

  make:
    - -j$(nproc)

  install:
    - -j$(nproc)
