
package: freetype
version: 2.12.1
sources: 
  - https://mirrors.ocf.berkeley.edu/nongnu/freetype/freetype-$VERSION.tar.xz

dependencies:
  - libpng
  - zlib

build:

  patches:
    - patches/freetype-$VERSION.patch

  env:
    - DESTDIR: $SYSROOT
    - CFLAGS: -O2 -march=x86-64 -mtune=generic
    - PKG_CONFIG: /usr/bin/pkg-config
    - PKG_CONFIG_LIBDIR: $PACKAGE_LIBPNG/__out/usr/lib/pkgconfig:$PACKAGE_ZLIB/__out/usr/lib/pkgconfig
    - PKG_CONFIG_RELOCATE_PATHS: "1"

  configure:
    - --prefix=/usr
    - --host=$HOST
    - --enable-static
    - --disable-shared
    - --disable-mmap
    - --disable-freetype-config
    - --without-pthreads
    - --without-harfbuzz
    - --without-bzip2
    - --without-brotli
    - --without-librsvg
    - --with-zlib
    - --with-png
    - --with-sysroot=$SYSROOT

  make:
    - -j$(nproc)

  install:
    - -j$(nproc)

  postinstall:
    - "sed -i 's|^Libs: -L/usr/lib |Libs: -L${libdir} |' $SYSROOT/usr/lib/pkgconfig/freetype2.pc"
