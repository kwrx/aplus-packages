
package: zlib
version: 1.3.2
sources: 
  - https://zlib.net/fossils/zlib-$VERSION.tar.gz

build:

  env:
    - CC: $HOST-gcc
    - CFLAGS: -O2 -march=x86-64 -mtune=generic

  configure:
    - --prefix=/usr
    - --static
    - --64

  make:
    - -j$(nproc)

  install:
    - DESTDIR=$SYSROOT
    - -j$(nproc)