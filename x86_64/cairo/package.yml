
package: cairo
version: 1.18.4
sources: 
  - https://www.cairographics.org/releases/cairo-$VERSION.tar.xz

dependencies:
  - freetype
  - pixman
  - libpng
  - zlib

build:

  env:
    - CFLAGS: -O2 -march=x86-64 -mtune=generic -fPIE -I$PACKAGE_FREETYPE/__out/usr/include -I$PACKAGE_PIXMAN/__out/usr/include -I$PACKAGE_LIBPNG/__out/usr/include -I$PACKAGE_ZLIB/__out/usr/include
    - LDFLAGS: -L$PACKAGE_FREETYPE/__out/usr/lib -L$PACKAGE_PIXMAN/__out/usr/lib -L$PACKAGE_LIBPNG/__out/usr/lib -L$PACKAGE_ZLIB/__out/usr/lib
    - PKG_CONFIG: /usr/bin/pkg-config
    - PKG_CONFIG_PATH: $PACKAGE_FREETYPE/__out/usr/lib/pkgconfig:$PACKAGE_PIXMAN/__out/usr/lib/pkgconfig:$PACKAGE_LIBPNG/__out/usr/lib/pkgconfig:$PACKAGE_ZLIB/__out/usr/lib/pkgconfig

  configure:
    - -Dprefix=$SYSROOT/usr
    - -Dbindir=$SYSROOT/usr/bin
    - -Ddatadir=$SYSROOT/usr/share
    - -Dincludedir=$SYSROOT/usr/include
    - -Dinfodir=$SYSROOT/usr/share/info
    - -Dlibdir=$SYSROOT/usr/lib
    - -Dlibexecdir=$SYSROOT/usr/libexec
    - -Dlocaledir=$SYSROOT/usr/share/locale
    - -Dlocalstatedir=$SYSROOT/var
    - -Dmandir=$SYSROOT/usr/share/man
    - -Dsysconfdir=$SYSROOT/etc
    - -Dbuildtype=release
    - -Ddefault_library=static
    - -Dstrip=true
    - -Dwarning_level=1
    - -Dwerror=false
    - -Ddwrite=disabled
    - -Dfontconfig=disabled
    - -Dfreetype=enabled
    - -Dpng=enabled
    - -Dquartz=disabled
    - -Dtee=disabled
    - -Dxcb=disabled
    - -Dxlib=disabled
    - -Dxlib-xcb=disabled
    - -Dzlib=disabled
    - -Dtests=disabled
    - -Dlzo=disabled
    - -Dgtk2-utils=disabled
    - -Dglib=disabled
    - -Dspectre=disabled
    - -Dsymbol-lookup=disabled
    - --cross-file=$PKGDIR/meson/meson-cross-$HOST.txt

  make:
    - -j$(nproc)

  install:
    - -j$(nproc)