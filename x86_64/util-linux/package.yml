package: util-linux
version: 2.42.4
sources:
  - https://www.kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-$VERSION.tar.xz

build:

  patches:
    - patches/util-linux-$VERSION.patch

  env:
    - DESTDIR: $SYSROOT
    - CFLAGS: -O2 -march=x86-64 -mtune=generic

  configure:
    - --prefix=/usr
    - --host=$HOST
    - --enable-static
    - --disable-shared
    - --disable-all-programs
    - --enable-libuuid
    - --disable-nls
    - --disable-asciidoc
    - --disable-poman
    - --disable-bash-completion
    - --disable-makeinstall-chown
    - --disable-makeinstall-setuid
    - --without-python
    - --without-systemd
    - --without-udev
    - --with-sysroot=$SYSROOT

  make:
    - -j$(nproc)

  install:
    - -j$(nproc)

  postinstall:
    - rm -rf $SYSROOT/usr/share/man/man5
