name: deploy

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Prepare environment
        working-directory: ${{github.workspace}}
        shell: bash
        run: sudo apt update && sudo apt install -y wget bison flex build-essential python3 python3-pip ninja-build unzip gtk-doc-tools autoconf libtool mtools gdisk grub-common fontconfig dosfstools fakeroot zip gperf libpng-dev

      - name: Prepare build-system
        working-directory: ${{github.workspace}}
        shell: bash
        run: ci/prepare-and-build.sh x86_64 x86_64-linux-gnu

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          if-no-files-found: ignore
          path: |
            /tmp/aplus-packages-build/*/__build/*.log
            /tmp/aplus-packages-build/*/__build/*.err
            /tmp/aplus-packages-build/*/__build/meson-logs/meson-log.txt

      - uses: "marvinpinto/action-automatic-releases@latest"
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          files: |
            ${{github.workspace}}/*.tar.xz
            ${{github.workspace}}/index
